name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: cp target/release/aurora-cover-maker aurora-cover-maker-linux-x86_64

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: aurora-cover-maker-linux-x86_64
